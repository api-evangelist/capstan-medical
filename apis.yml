aid: capstan-medical
name: Capstan Medical
description: 'Capstan Medical is a Santa Cruz, California medical device company founded
  in 2020 out of the Occam Labs incubator by Dan Wallace, with Maggie Nixon as CEO.
  The company is developing a surgical robotics platform for structural heart disease,
  merging robotic catheter navigation with next-generation transcatheter mitral and
  tricuspid valve implants so heart valves can be repaired or replaced without open
  heart surgery. In 2025 Capstan completed what it describes as the world''s first
  robotic catheter mitral valve replacements in humans, and it raised a $110M Series
  C led by Eclipse with participation from Intuitive Ventures and Yu Galaxy, bringing
  total funding past $150M ahead of a second-generation system planned for 2026. Capstan
  is pre-commercial and regulated medical device focused: it publishes no public developer
  portal, API documentation, SDKs, or machine-readable API contracts.'
